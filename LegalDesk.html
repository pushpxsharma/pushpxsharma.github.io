  var groups=Object.entries(cG).sort(function(a,b){return(b[1].owed-b[1].paid)-(a[1].owed-a[1].paid)});

// Court Fees Act, 1870 — Schedule I, Article 1 ad-valorem slab (operative statutory formula).
// 16 annas = 1 rupee. Returns {fee, capped, steps[]}.
function cf1870(V){
  V=Number(V)||0;var steps=[];
  var ceilDiv=function(a,b){return Math.ceil(a/b)};
  if(V<=0)return{fee:0,capped:false,steps:[]};
  var fee=0;
  // Band 1: up to Rs.100 — 6 annas per Rs.5 (or part), incl. the first Rs.5
  var b1=Math.min(V,100);var u1=ceilDiv(b1,5);var f1=u1*6/16;fee+=f1;
  steps.push({band:'Up to \u20b9100',rate:'6 annas / \u20b95',calc:u1+' \u00d7 6 annas',amt:f1});
  // Band 2: 100–1000 — 12 annas per Rs.10 (or part)
  if(V>100){var b2=Math.min(V,1000);var u2=ceilDiv(b2-100,10);var f2=u2*12/16;fee+=f2;steps.push({band:'\u20b9100 \u2013 \u20b91,000',rate:'12 annas / \u20b910',calc:u2+' \u00d7 12 annas',amt:f2});}
  // Band 3: 1000–5000 — Rs.5 per Rs.100 (or part)
  if(V>1000){var b3=Math.min(V,5000);var u3=ceilDiv(b3-1000,100);var f3=u3*5;fee+=f3;steps.push({band:'\u20b91,000 \u2013 \u20b95,000',rate:'\u20b95 / \u20b9100',calc:u3+' \u00d7 \u20b95',amt:f3});}
  // Band 4: 5000–10000 — Rs.10 per Rs.250 (or part)
  if(V>5000){var b4=Math.min(V,10000);var u4=ceilDiv(b4-5000,250);var f4=u4*10;fee+=f4;steps.push({band:'\u20b95,000 \u2013 \u20b910,000',rate:'\u20b910 / \u20b9250',calc:u4+' \u00d7 \u20b910',amt:f4});}
  // Band 5: 10000–20000 — Rs.15 per Rs.500 (or part)
  if(V>10000){var b5=Math.min(V,20000);var u5=ceilDiv(b5-10000,500);var f5=u5*15;fee+=f5;steps.push({band:'\u20b910,000 \u2013 \u20b920,000',rate:'\u20b915 / \u20b9500',calc:u5+' \u00d7 \u20b915',amt:f5});}
  // Band 6: 20000–30000 — Rs.20 per Rs.1000 (or part)
  if(V>20000){var b6=Math.min(V,30000);var u6=ceilDiv(b6-20000,1000);var f6=u6*20;fee+=f6;steps.push({band:'\u20b920,000 \u2013 \u20b930,000',rate:'\u20b920 / \u20b91,000',calc:u6+' \u00d7 \u20b920',amt:f6});}
  // Band 7: 30000–50000 — Rs.20 per Rs.2000 (or part)
  if(V>30000){var b7=Math.min(V,50000);var u7=ceilDiv(b7-30000,2000);var f7=u7*20;fee+=f7;steps.push({band:'\u20b930,000 \u2013 \u20b950,000',rate:'\u20b920 / \u20b92,000',calc:u7+' \u00d7 \u20b920',amt:f7});}
  // Band 8: above 50000 — Rs.25 per Rs.5000 (or part)
  if(V>50000){var u8=ceilDiv(V-50000,5000);var f8=u8*25;fee+=f8;steps.push({band:'Above \u20b950,000',rate:'\u20b925 / \u20b95,000',calc:u8+' \u00d7 \u20b925',amt:f8});}
  var capped=false;
  return{fee:fee,capped:capped,steps:steps};
}
